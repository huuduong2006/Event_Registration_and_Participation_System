<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vé của tôi</title><link rel="stylesheet" href="/assets/shared.css"></head>
<body><header class="topbar" id="topbar"></header>
<main class="wrap"><h1>Vé của tôi</h1><div id="list" class="grid"><p class="mute">Đang tải…</p></div>
<h2 style="margin-top:26px">Thông tin cá nhân</h2><div class="card"><div id="msg" class="alert" hidden></div>
<form id="profile" novalidate><label>Họ và tên<input name="fullName"></label><label>Số điện thoại<input name="phoneNumber"></label>
<label>Email<input id="email" disabled></label>
<details><summary>Đổi mật khẩu</summary><label>Mật khẩu hiện tại<input name="currentPassword" type="password" autocomplete="current-password"></label>
<label>Mật khẩu mới<input name="newPassword" type="password" autocomplete="new-password"></label></details>
<button class="btn primary">Lưu thay đổi</button></form></div></main>
<script src="/assets/common.js"></script><script src="/assets/attendee.js"></script><script src="/account/account.js"></script></body></html>

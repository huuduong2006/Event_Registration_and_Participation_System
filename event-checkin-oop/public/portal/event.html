<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đăng ký sự kiện</title><link rel="stylesheet" href="/assets/shared.css"></head>
<body><header class="topbar" id="topbar"></header>
<main class="wrap"><div id="ev"><p class="mute">Đang tải…</p></div>
<section id="formcard" class="card" hidden><h2>Đăng ký tham dự</h2><div id="msg" class="alert" hidden></div>
<form id="form" novalidate>
 <div id="guestFields"><label>Họ và tên<input name="fullName" autocomplete="name" required></label>
 <label>Email (vé QR sẽ gửi tới đây)<input name="email" type="email" autocomplete="email" required></label>
 <label>Số điện thoại<input name="phoneNumber" type="tel" autocomplete="tel" placeholder="0901234567" required></label></div>
 <label>Loại vé<select name="ticketTypeId" required></select></label>
 <button class="btn primary" id="submit" style="width:100%">Đăng ký nhận vé</button></form></section>
<section id="done" class="card" hidden><h2>✅ Đăng ký thành công</h2><p id="doneInfo" class="mute"></p>
<div class="qrbox"><img id="qr" alt="Mã QR vé"></div>
<p class="small mute">Mã QR cũng đã được gửi qua email. Hãy chụp màn hình hoặc xuất trình email này tại cổng.</p>
<a class="btn" href="/">Về trang chủ</a> <a class="btn primary" id="myTickets" href="/account/" hidden>Xem vé của tôi</a></section></main>
<script src="/assets/common.js"></script><script src="/assets/attendee.js"></script><script src="/portal/event.js"></script></body></html>
